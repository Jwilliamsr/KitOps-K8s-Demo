apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-classifier
  labels:
    app: text-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-classifier
  template:
    metadata:
      labels:
        app: text-classifier
    spec:
      # ---------- KitOps Init Container ----------
      volumes:
        - name: model-store
          emptyDir: {}
      initContainers:
        - name: kitops-init
          image: ghcr.io/kitops-ml/kitops-init:latest
          env:
            - name: MODELKIT_REF
              value: "jozu.ml/arnabchat2001/text-classifier:0.1.0"
            - name: UNPACK_PATH
              value: "/model"
          volumeMounts:
            - name: model-store
              mountPath: /model

      # ---------- Simple Demo Container ----------
      containers:
        - name: api
          image: python:3.9-slim
          command: ["/bin/bash"]
          args:
            - -c
            - |
              echo "Installing dependencies..."
              pip install --no-cache-dir fastapi uvicorn
              echo "Creating simple demo app..."
              cd /app
              cat > demo_app.py << 'EOF'
              from fastapi import FastAPI
              import os
              import json

              app = FastAPI(title="KitOps Text Classifier Demo")

              @app.get("/health")
              def health():
                  return {"status": "healthy", "model_path": os.environ.get("MODEL_PATH", "not_set")}

              @app.get("/")
              def root():
                  return {
                      "message": "KitOps Text Classifier Demo", 
                      "model_path": os.environ.get("MODEL_PATH", "not_set"),
                      "model_files": list_model_files()
                  }

              @app.post("/predict")
              def predict(text: dict):
                  # Simple demo response
                  input_text = text.get("text", "")
                  return {
                      "input": input_text,
                      "prediction": "spam" if "spam" in input_text.lower() else "ham",
                      "confidence": 0.95,
                      "model": "KitOps FLAN-T5 Demo",
                      "message": "This is a demo showing KitOps model deployment"
                  }

              def list_model_files():
                  model_path = os.environ.get("MODEL_PATH", "/model/fine-tuned")
                  try:
                      if os.path.exists(model_path):
                          return os.listdir(model_path)
                      else:
                          return ["Model path not found"]
                  except:
                      return ["Error reading model files"]

              if __name__ == "__main__":
                  import uvicorn
                  uvicorn.run(app, host="0.0.0.0", port=8000)
              EOF
              echo "Starting demo app..."
              python3 demo_app.py
          env:
            - name: MODEL_PATH
              value: "/model/fine-tuned"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model-store
              mountPath: /model
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      
      volumes:
        - name: model-store
          emptyDir: {} 