apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-classifier
  labels:
    app: text-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-classifier
  template:
    metadata:
      labels:
        app: text-classifier
    spec:
      # ---------- KitOps Init Container ----------
      volumes:
        - name: model-store
          emptyDir: {}
      initContainers:
        - name: kitops-init
          image: ghcr.io/kitops-ml/kitops-init:latest
          env:
            - name: MODELKIT_REF
              value: "jozu.ml/arnabchat2001/text-classifier:0.1.0"
            - name: UNPACK_PATH
              value: "/model"
          volumeMounts:
            - name: model-store
              mountPath: /model

      # ---------- Demo API Container ----------
      containers:
        - name: api
          image: python:3.9-slim
          command: ["/bin/bash"]
          args:
            - -c
            - |
              echo "Installing dependencies..."
              pip install --no-cache-dir fastapi uvicorn pydantic
              echo "Starting application..."
              cd /app
              python3 app.py
          env:
            - name: MODEL_PATH
              value: "/model/fine-tuned"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model-store
              mountPath: /model
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      
      volumes:
        - name: model-store
          emptyDir: {}
        - name: app-code
          configMap:
            name: app-code 